<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dhaka Route Planner | ঢাকা রুট প্ল্যানার</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070d0c;--bg2:#0d1715;--card:rgba(255,255,255,.045);--line:rgba(212,175,55,.22);--tx:#f1ede2;--mut:#9fb0aa;--gold:#e0b84a;--gold2:#f7e0a0;--gold3:#a9801c;--metro:#4be0a5;--bus:#e0b84a;--warn:#ff9f6b}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Hind Siliguri',system-ui,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,#12332b 0,transparent 60%),radial-gradient(900px 500px at -10% 30%,#2a2108 0,transparent 55%),var(--bg);color:var(--tx);min-height:100vh;line-height:1.55}
.wrap{max-width:980px;margin:auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0 22px}
.logo{display:flex;align-items:center;gap:12px}
.logo i{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--gold2),var(--gold3));display:grid;place-items:center;font-style:normal;font-size:22px;box-shadow:0 8px 30px rgba(224,184,74,.35);animation:float 4s ease-in-out infinite}
.logo b{font-family:'Playfair Display','Hind Siliguri',serif;font-size:20px;letter-spacing:.3px}
.logo small{display:block;color:var(--mut);font-size:12px}
@keyframes float{50%{transform:translateY(-4px) rotate(-4deg)}}
.lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{border:0;background:none;color:var(--mut);padding:6px 16px;border-radius:99px;cursor:pointer;font:600 13px inherit;font-family:inherit;transition:.3s}
.lang button.on{background:linear-gradient(135deg,var(--gold2),var(--gold3));color:#1a1405}
.hero h1{font-family:'Playfair Display','Hind Siliguri',serif;font-size:clamp(28px,5.4vw,46px);line-height:1.15;max-width:640px;background:linear-gradient(100deg,#fff 20%,var(--gold2) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .9s both}
.hero p{color:var(--mut);margin:10px 0 22px;max-width:560px;animation:rise .9s .15s both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.tabs button{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--mut);padding:9px 18px;border-radius:12px;cursor:pointer;font:600 14px inherit;font-family:inherit;transition:.25s}
.tabs button:hover{color:var(--tx);border-color:var(--gold)}
.tabs button.on{color:#1a1405;background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:transparent}
.panel{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:22px;padding:20px;backdrop-filter:blur(10px);box-shadow:0 20px 60px rgba(0,0,0,.45);animation:rise .5s both}
.fields{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:5px}
.in{position:relative}
input,select{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--tx);padding:13px 14px;border-radius:13px;font:500 15px inherit;font-family:inherit;outline:0;transition:.25s}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(224,184,74,.15)}
.loc{position:absolute;right:6px;top:29px;background:none;border:0;cursor:pointer;font-size:17px;padding:6px}
.swap{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);color:var(--gold);font-size:19px;cursor:pointer;transition:.5s}
.swap:hover{transform:rotate(180deg);border-color:var(--gold)}
.btn{position:relative;overflow:hidden;border:0;cursor:pointer;color:#1a1405;font:700 16px inherit;font-family:inherit;padding:14px 28px;border-radius:14px;background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--gold3));box-shadow:0 10px 28px rgba(224,184,74,.3),inset 0 1px 0 rgba(255,255,255,.5);transition:.25s;width:100%;margin-top:14px}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:.7s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(224,184,74,.45)}
.btn:hover::after{left:130%}
.btn:active{transform:scale(.98)}
.btn.sm{width:auto;margin:0;padding:9px 16px;font-size:13px;border-radius:11px}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold);box-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px;color:var(--tx);cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--gold);color:var(--gold2)}
.chip.m{border-color:rgba(75,224,165,.5);color:var(--metro)}
#res{margin-top:18px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;animation:rise .55s both;transition:.25s}
.card:hover{border-color:rgba(224,184,74,.55);transform:translateY(-2px)}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(224,184,74,.15);color:var(--gold2)}
.tag.m{background:rgba(75,224,165,.15);color:var(--metro)}
.tag.w{background:rgba(255,159,107,.15);color:var(--warn)}
.leg{display:flex;gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.leg:first-of-type{border-top:0}
.dot{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(224,184,74,.14);font-size:18px}
.dot.m{background:rgba(75,224,165,.14)}
.leg h4{font-size:15.5px}
.leg p{color:var(--mut);font-size:13.5px}
.fare{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.fare span{background:rgba(0,0,0,.35);border-radius:9px;padding:3px 10px;font-size:13px}
.fare b{color:var(--gold2)}
.sum{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--mut)}
.sum b{color:var(--tx);font-size:19px}
.sec{font-family:'Playfair Display','Hind Siliguri',serif;font-size:19px;margin:6px 0 2px}
.note{color:var(--mut);font-size:12.5px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.path{color:var(--mut);font-size:13px;margin-top:8px;line-height:1.9}
.path em{font-style:normal;color:var(--gold);margin:0 3px}
.tl{margin-top:14px;position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--metro),#1f7a57);animation:grow 1.4s both;transform-origin:top}
@keyframes grow{from{transform:scaleY(0)}}
.st{position:relative;display:flex;justify-content:space-between;gap:10px;padding:7px 0;animation:rise .5s both}
.st::before{content:"";position:absolute;left:-24px;top:14px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:3px solid var(--metro)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.hide{display:none}
footer{margin-top:26px;color:var(--mut);font-size:12.5px;text-align:center}
@media(max-width:640px){.fields{grid-template-columns:1fr}.swap{justify-self:center;margin:-2px 0}.loc{top:29px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div class="logo"><i>🚌</i><div><b data-t="brand"></b><small data-t="tag"></small></div></div>
 <div class="lang"><button id="lb" onclick="setL('bn')">বাংলা</button><button id="le" onclick="setL('en')">EN</button></div>
</header>
<div class="hero"><h1 data-t="h1"></h1><p data-t="sub"></p></div>
<nav class="tabs" id="tabs"></nav>

<section id="p-plan" class="panel">
 <div class="fields">
  <div class="in"><label data-t="from"></label><input id="a" list="dl" autocomplete="off"><button class="loc" onclick="near('a')" title="GPS">📍</button></div>
  <button class="swap" onclick="swp()" aria-label="swap">⇅</button>
  <div class="in"><label data-t="to"></label><input id="b" list="dl" autocomplete="off"></div>
 </div>
 <datalist id="dl"></datalist>
 <button class="btn" onclick="go()" data-t="go"></button>
 <div class="chips" id="rec"></div>
 <div id="res"></div>
</section>

<section id="p-routes" class="panel hide">
 <input id="rq" oninput="drawRoutes()" data-ph="search_r">
 <div class="grid" id="rl"></div>
</section>

<section id="p-metro" class="panel hide">
 <div class="top"><div><div class="sec" data-t="mrt"></div><p class="note" style="margin:0" data-t="mrtd"></p></div>
 <div style="min-width:220px"><label data-t="fromst"></label><select id="ms" onchange="drawMetro()"></select></div></div>
 <div class="tl" id="mt"></div>
</section>

<section id="p-stops" class="panel hide">
 <input id="sq" oninput="drawStops()" data-ph="search_s">
 <div class="chips" id="sl"></div>
</section>

<section id="p-fare" class="panel hide">
 <div class="sec" data-t="farehead"></div>
 <div id="fr"></div>
</section>

<footer data-t="foot"></footer>
</div>

const T={
bn:{brand:'ঢাকা রুট প্ল্যানার',tag:'বাস • মেট্রোরেল • ভাড়া • সময়',h1:'ঢাকার যেকোনো জায়গায়, সঠিক রুটে।',sub:'দুটি স্টপের নাম লিখুন। বাস, মেট্রোরেল, ভাড়া, ছাত্র ভাড়া ও সময় এক নজরে দেখে নিন।',from:'কোথা থেকে',to:'কোথায় যাবেন',go:'রুট খুঁজুন',plan:'রুট খোঁজা',routes:'সব রুট',metro:'মেট্রোরেল',stops:'সব স্টপ',fare:'ভাড়া তালিকা',direct:'সরাসরি বাস',transfer:'পরিবর্তন করে যাত্রা',other:'অন্যান্য যানবাহন',min:'মিনিট',km:'কিমি',stopsN:'টি স্টপ',pp:'জনপ্রতি',stu:'ছাত্র',board:'উঠুন',alight:'নামুন',change:'এখানে বাস বদলান',total:'মোট ভাড়া',time:'আনুমানিক সময়',noroute:'এই দুই স্টপের মধ্যে সরাসরি বা এক পরিবর্তনের রুট পাওয়া যায়নি।',pick:'তালিকা থেকে দুটি স্টপ বেছে নিন।',gmap:'গুগল ম্যাপে লাইভ দেখুন',walk:'হেঁটে যান',rick:'রিকশা',cng:'সিএনজি',bike:'রাইড-শেয়ার বাইক',same:'একই স্টপ বেছেছেন। আলাদা গন্তব্য দিন।',search_r:'রুট বা স্টপ খুঁজুন…',search_s:'স্টপের নাম লিখুন…',mrt:'এমআরটি লাইন-৬ (উত্তরা উত্তর – কমলাপুর)',mrtd:'স্টেশন বেছে নিন, সেখান থেকে প্রতিটি স্টেশনের ভাড়া ও সময় দেখুন।',fromst:'শুরুর স্টেশন',farehead:'ভাড়ার নিয়ম (আনুমানিক)',foot:'ভাড়া ও সময় আনুমানিক। যাত্রার আগে চালক/কাউন্টারে যাচাই করুন। লাইভ তথ্যের জন্য গুগল ম্যাপ ব্যবহার করুন।',recent:'সাম্প্রতিক',nearest:'কাছের স্টপ',gpsfail:'লোকেশন পাওয়া যায়নি',bus:'বাস',mt:'মেট্রো',tk:'৳',walkto:'হেঁটে যান',near:'গন্তব্যের কাছে'},
en:{brand:'Dhaka Route Planner',tag:'Bus • Metro Rail • Fare • Time',h1:'Anywhere in Dhaka, on the right route.',sub:'Enter two stops. See buses, metro rail, fares, student fares and travel time at a glance.',from:'From',to:'To',go:'Find route',plan:'Plan trip',routes:'All routes',metro:'Metro rail',stops:'All stops',fare:'Fare guide',direct:'Direct bus',transfer:'With a change',other:'Other transport',min:'min',km:'km',stopsN:' stops',pp:'Per person',stu:'Student',board:'Board',alight:'Get off',change:'Change buses here',total:'Total fare',time:'Estimated time',noroute:'No direct or one-change route found between these stops.',pick:'Pick two stops from the list.',gmap:'Live on Google Maps',walk:'Walk',rick:'Rickshaw',cng:'CNG auto',bike:'Ride-share bike',same:'Both stops are the same. Choose a different destination.',search_r:'Search routes or stops…',search_s:'Type a stop name…',mrt:'MRT Line-6 (Uttara North – Kamalapur)',mrtd:'Choose a station to see fare and time to every other station.',fromst:'Starting station',farehead:'Fare rules (estimated)',foot:'Fares and times are estimates. Confirm with the conductor or counter. Use Google Maps for live data.',recent:'Recent',nearest:'Nearest stop',gpsfail:'Could not get location',bus:'Bus',mt:'Metro',tk:'৳',walkto:'Walk to',near:'near destination'}
};
let L=localStorage.getItem('lang')||'bn';
const t=k=>T[L][k];
const nm=s=>L==='bn'?s.bn:s.en;
const num=n=>L==='bn'?String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]):String(n);
const lab=s=>s.en+' / '+s.bn;

/* ===== calc ===== */
const rad=x=>x*Math.PI/180;
function hav(a,b){const R=6371,dl=rad(b.la-a.la),dn=rad(b.lo-a.lo);const x=Math.sin(dl/2)**2+Math.cos(rad(a.la))*Math.cos(rad(b.la))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function leg(r,a,b){
 const i=r.st.indexOf(a),j=r.st.indexOf(b);if(i<0||j<0||i===j)return null;
 const x=Math.min(i,j),y=Math.max(i,j);let d=0;
 for(let k=x;k<y;k++)d+=hav(byId[r.st[k]],byId[r.st[k+1]])*1.25;
 const hops=y-x,m=r.type==='metro';
 const fare=m?Math.min(100,20+Math.ceil((hops-1)*5.33/10)*10):Math.max(10,Math.round(d*2.45));
 const sfare=m?fare:Math.max(5,Math.round(fare/2));
 const time=Math.round(m?5+d/32*60+hops*.4:8+d/12*60);
 return{r,a,b,d,hops,fare,sfare,time}
}
function plan(A,B){
 const direct=R.map(r=>leg(r,A,B)).filter(Boolean).sort((p,q)=>p.time-q.time);
 if(direct.length)return{direct};
 const best={};
 for(const r1 of R){if(!r1.st.includes(A))continue;
  for(const r2 of R){if(r1===r2||!r2.st.includes(B))continue;
   for(const x of r1.st){if(x===A||x===B||!r2.st.includes(x))continue;
    const l1=leg(r1,A,x),l2=leg(r2,x,B);if(!l1||!l2)continue;
    const tot=l1.time+l2.time+6,k=r1.id+r2.id;
    if(!best[k]||tot<best[k].tot)best[k]={l:[l1,l2],tot,fare:l1.fare+l2.fare,sfare:l1.sfare+l2.sfare,d:l1.d+l2.d}}}}
 return{trans:Object.values(best).sort((p,q)=>p.tot-q.tot).slice(0,4)}
}
function others(A,B){
 const d=hav(byId[A],byId[B])*1.25,o=[];
 if(d<=2.5)o.push(['🚶',t('walk'),Math.round(d/4.5*60),0]);
 if(d<=7)o.push(['🛺',t('rick'),Math.round(d/10*60),Math.max(30,Math.round(d*35))]);
 if(d<=25)o.push(['🛵',t('cng'),Math.round(5+d/16*60),Math.max(70,Math.round(d*40))]);
 if(d<=40)o.push(['🏍️',t('bike'),Math.round(6+d/20*60),Math.max(50,Math.round(d*30))]);
 return o
}

/* ===== UI ===== */
function find(v){v=v.trim().toLowerCase();if(!v)return;return S.find(s=>lab(s).toLowerCase()===v)||S.find(s=>s.en.toLowerCase()===v||s.bn===v)||S.find(s=>s.en.toLowerCase().includes(v)||s.bn.includes(v))}
const $=id=>document.getElementById(id);
const legHtml=l=>{const m=l.r.type==='metro';return`<div class="leg"><div class="dot ${m?'m':''}">${m?'🚇':'🚌'}</div><div><h4>${nm(l.r)} <span class="tag ${m?'m':''}">${m?t('mt'):t('bus')}</span></h4>
<p>${t('board')}: <b>${nm(byId[l.a])}</b> → ${t('alight')}: <b>${nm(byId[l.b])}</b></p>
<p>${num(l.hops)}${t('stopsN')} • ${num(l.d.toFixed(1))} ${t('km')} • ~${num(l.time)} ${t('min')}</p>
<div class="fare"><span>${t('pp')}: <b>${t('tk')}${num(l.fare)}</b></span><span>${t('stu')}: <b>${t('tk')}${num(l.sfare)}</b></span></div></div></div>`};
function go(){
 const A=find($('a').value),B=find($('b').value),res=$('res');
 if(!A||!B){res.innerHTML=`<div class="empty">${t('pick')}</div>`;return}
 if(A.id===B.id){res.innerHTML=`<div class="empty">${t('same')}</div>`;return}
 rec(A.id,B.id);
 const p=plan(A.id,B.id);let h='';
 if(p.direct){h+=`<div class="sec">${t('direct')}</div>`;
  h+=p.direct.map((l,i)=>`<div class="card" style="animation-delay:${i*.08}s"><div class="top"><div class="sum"><span>${t('time')}<br><b>${num(l.time)} ${t('min')}</b></span></div></div>${legHtml(l)}</div>`).join('')}
 else if(p.trans.length){h+=`<div class="sec">${t('transfer')}</div>`;
  h+=p.trans.map((o,i)=>`<div class="card" style="animation-delay:${i*.08}s"><div class="top"><div class="sum"><span>${t('time')}<br><b>${num(o.tot)} ${t('min')}</b></span><span>${t('total')}<br><b>${t('tk')}${num(o.fare)}</b> <small>(${t('stu')} ${t('tk')}${num(o.sfare)})</small></span></div><span class="tag w">${t('change')}: ${nm(byId[o.l[0].b])}</span></div>${o.l.map(legHtml).join('')}</div>`).join('')}
 else h+=`<div class="card"><span class="tag w">${t('noroute')}</span></div>`;
 const od=others(A.id,B.id);
 if(od.length)h+=`<div class="sec">${t('other')}</div><div class="card">${od.map(o=>`<div class="leg"><div class="dot">${o[0]}</div><div><h4>${o[1]}</h4><p>~${num(o[2])} ${t('min')}${o[3]?` • ~${t('tk')}${num(o[3])}`:''}</p></div></div>`).join('')}</div>`;
 const u=`https://www.google.com/maps/dir/?api=1&origin=${A.la},${A.lo}&destination=${B.la},${B.lo}&travelmode=transit`;
 h+=`<a href="${u}" target="_blank" rel="noopener"><button class="btn">🗺️ ${t('gmap')}</button></a><p class="note">${t('foot')}</p>`;
 res.innerHTML=h
}
function swp(){const a=$('a').value;$('a').value=$('b').value;$('b').value=a}
function near(id){
 if(!navigator.geolocation)return;
 navigator.geolocation.getCurrentPosition(p=>{const c={la:p.coords.latitude,lo:p.coords.longitude};
  const s=[...S].sort((x,y)=>hav(c,x)-hav(c,y))[0];$(id).value=lab(s)},()=>alert(t('gpsfail')))
}
function rec(a,b){try{let r=JSON.parse(localStorage.getItem('rec')||'[]').filter(x=>x.join()!==[a,b].join());r.unshift([a,b]);localStorage.setItem('rec',JSON.stringify(r.slice(0,5)));drawRec()}catch(e){}}
function drawRec(){let r=[];try{r=JSON.parse(localStorage.getItem('rec')||'[]')}catch(e){}
 $('rec').innerHTML=r.map(x=>`<span class="chip" onclick="$('a').value='${lab(byId[x[0]])}';$('b').value='${lab(byId[x[1]])}';go()">⏱ ${nm(byId[x[0]])} → ${nm(byId[x[1]])}</span>`).join('')}
function drawRoutes(){
 const q=$('rq').value.trim().toLowerCase();
 $('rl').innerHTML=R.filter(r=>!q||r.en.toLowerCase().includes(q)||r.bn.includes(q)||r.st.some(s=>byId[s].en.toLowerCase().includes(q)||byId[s].bn.includes(q))).map(r=>`<div class="card"><div class="top"><h4>${nm(r)}</h4><span class="tag ${r.type==='metro'?'m':''}">${r.type==='metro'?t('mt'):t('bus')}</span></div><div class="path">${r.st.map(s=>nm(byId[s])).join('<em>›</em>')}</div></div>`).join('')
}
function drawStops(){
 const q=$('sq').value.trim().toLowerCase();
 $('sl').innerHTML=S.filter(s=>!q||s.en.toLowerCase().includes(q)||s.bn.includes(q)).map(s=>`<span class="chip ${MRT.st.includes(s.id)?'m':''}" onclick="pickStop('${s.id}')">${nm(s)}</span>`).join('')
}
function pickStop(id){const f=$('a').value?($('b')):$('a');f.value=lab(byId[id]);tab('plan')}
function drawMetro(){
 const f=$('ms').value;
 $('mt').innerHTML=MRT.st.map((s,i)=>{const l=leg(MRT,f,s);return`<div class="st" style="animation-delay:${i*.05}s"><b>${nm(byId[s])}</b><span style="color:var(--mut);font-size:13.5px">${l?`${t('tk')}${num(l.fare)} • ${num(l.time)} ${t('min')}`:'—'}</span></div>`}).join('')
}
function drawFare(){
 $('fr').innerHTML=`<div class="card"><div class="leg"><div class="dot">🚌</div><div><h4>${t('bus')}</h4><p>${L==='bn'?'প্রতি কিমি ২.৪৫ টাকা, সর্বনিম্ন ১০ টাকা (বিআরটিএ নির্ধারিত হার ভিত্তিক হিসাব)। ছাত্রদের জন্য আনুমানিক অর্ধেক ভাড়া।':'About ৳2.45 per km, minimum ৳10 (BRTA-rate based estimate). Students pay roughly half.'}</p></div></div><div class="leg"><div class="dot m">🚇</div><div><h4>${t('metro')}</h4><p>${L==='bn'?'সর্বনিম্ন ২০ টাকা, সর্বোচ্চ ১০০ টাকা (উত্তরা উত্তর–কমলাপুর)। স্টেশন সংখ্যা অনুযায়ী ধাপে ধাপে বাড়ে।':'Minimum ৳20 up to ৳100 (Uttara North – Kamalapur), rising in steps by station count.'}</p></div></div></div>`
}
const TABS=['plan','routes','metro','stops','fare'];
function tab(n){TABS.forEach(x=>{$('p-'+x).classList.toggle('hide',x!==n)});[...$('tabs').children].forEach((b,i)=>b.classList.toggle('on',TABS[i]===n))}
function setL(l){L=l;try{localStorage.setItem('lang',l)}catch(e){}
 document.documentElement.lang=l;
 $('lb').classList.toggle('on',l==='bn');$('le').classList.toggle('on',l==='en');
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
 $('tabs').innerHTML=TABS.map(x=>`<button onclick="tab('${x}')">${{plan:'🧭 ',routes:'🚌 ',metro:'🚇 ',stops:'📍 ',fare:'৳ '}[x]}${t(x==='plan'?'plan':x)}</button>`).join('');
 const cur=TABS.find(x=>!$('p-'+x).classList.contains('hide'))||'plan';tab(cur);
 const sel=$('ms').value||'uns';$('ms').innerHTML=MRT.st.map(s=>`<option value="${s}">${nm(byId[s])}</option>`).join('');$('ms').value=sel;
 $('res').innerHTML='';drawRec();drawRoutes();drawStops();drawMetro();drawFare()
}
$('dl').innerHTML=S.map(s=>`<option value="${lab(s)}">`).join('');
['a','b'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')go()}));
setL(L);
</script>
</body>
</html>
