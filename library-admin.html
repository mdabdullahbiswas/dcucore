<link rel="icon" type="image/webp" href="/logo.webp">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

(function(){var t=null;try{t=localStorage.getItem('adminTheme')}catch(e){}

if(new URLSearchParams(location.search).has("embed"))document.documentElement.classList.add("embed");})();

<style>
:root{
  --bg:#f3f6fb;--surface:#fff;--surface2:#f7f9fd;--ink:#0e1a2e;--mu:#64748b;--ln:#e4e9f2;
  --navy:#0a2240;--navy2:#14386a;--gold:#e5a83b;--gold2:#f6d68f;
  --red:#d92d20;--redSoft:#fee4e2;--green:#12a150;--greenSoft:#dcfae6;--amber:#b54708;--amberSoft:#fef0c7;
  --shadow:0 1px 2px rgba(14,26,46,.05),0 8px 24px rgba(14,26,46,.06);
  --f:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
}
html[data-theme=dark]{
  --bg:#08101e;--surface:#101b2f;--surface2:#142339;--ink:#e8eef9;--mu:#94a5bf;--ln:#213352;
  --redSoft:#3a1612;--greenSoft:#0d2e1d;--amberSoft:#38270a;--amber:#f5b94a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
html.embed .wrap{padding-top:12px}
.card{background:var(--surface);border:1px solid var(--ln);border-radius:18px;box-shadow:var(--shadow)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- লগইন ---------- */
#gate{max-width:420px;margin:6vh auto 0}
.g-hero{padding:30px 24px 22px;text-align:center;color:#fff;border-radius:18px 18px 0 0;background:linear-gradient(140deg,#07192f,#0a2240 55%,#14386a);border-bottom:3px solid var(--gold)}
.g-hero h1{font-size:1.5rem;line-height:1.3}
.g-hero p{margin-top:6px;color:var(--gold2);font-size:.9rem}
.g-body{padding:22px 22px 24px;display:grid;gap:14px}
.g-body label{display:grid;gap:6px;font-weight:600;font-size:.92rem}
.in{width:100%;min-height:46px;padding:9px 13px;border:1.5px solid var(--ln);border-radius:12px;background:var(--surface);font-size:1rem}
.in:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(229,168,59,.22)}
.msg{min-height:1.2em;color:var(--red);font-size:.9rem;font-weight:500}
.or{text-align:center;color:var(--mu);font-size:.85rem}

/* ---------- বোতাম ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 18px;border:1.5px solid var(--ln);border-radius:99px;background:var(--surface);font-weight:600;font-size:.93rem;cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--gold)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:progress}
.btn.pri{border-color:transparent;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#0a2240;font-weight:700}
.btn.ok{border-color:transparent;background:var(--green);color:#fff;font-weight:700}
.btn.dng{border-color:transparent;background:var(--redSoft);color:var(--red);font-weight:700}
.btn.sm{min-height:36px;padding:5px 14px;font-size:.86rem}
.btn.wide{width:100%}
a.btn{text-decoration:none;color:inherit}
.fm .r2{align-items:start}
.fm .in[type=number]{min-height:46px}

/* ---------- টুলবার, ফিল্টার ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.bar h2{font-size:1.25rem;flex:1 1 220px}
.bar h2 small{display:block;color:var(--mu);font-weight:400;font-size:.85rem}
.who{color:var(--mu);font-size:.85rem;overflow-wrap:anywhere}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.f{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 16px;border:1px solid var(--ln);border-radius:99px;background:var(--surface);font-weight:600;font-size:.92rem;cursor:pointer}
.f em{font-style:normal;font-size:.8rem;opacity:.75}
.f.on{border-color:transparent;background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff}
.search{width:100%;margin-bottom:14px}

/* ---------- তালিকা ---------- */
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;padding:14px 16px}
.item h3{font-size:1.02rem;line-height:1.4;overflow-wrap:anywhere}
.meta{margin-top:4px;color:var(--mu);font-size:.85rem;overflow-wrap:anywhere}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;vertical-align:middle}
.pill.warn{background:var(--amberSoft);color:var(--amber)}
.pill.ok{background:var(--greenSoft);color:var(--green)}
.pill.mu{background:var(--surface2);color:var(--mu);border:1px solid var(--ln)}
.empty{padding:38px 18px;text-align:center;color:var(--mu)}
.sk{height:74px;border-radius:18px;background:linear-gradient(90deg,var(--surface2),var(--ln),var(--surface2));background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- রিভিউ ডায়ালগ ---------- */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px;background:rgba(7,16,30,.62)}
.dlg{width:100%;max-width:980px;margin:auto;overflow:hidden}
.dh{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--ln)}
.dh h3{flex:1;font-size:1.1rem}
.x{width:40px;height:40px;border:0;border-radius:50%;background:var(--surface2);font-size:1.3rem;cursor:pointer}
.db{display:grid;grid-template-columns:1.1fr 1fr;gap:0}
.pv{padding:16px;background:var(--surface2);border-right:1px solid var(--ln);display:grid;align-content:start;gap:12px}
.pv iframe{width:100%;height:min(62vh,520px);border:1px solid var(--ln);border-radius:12px;background:#fff}
.probe{display:flex;align-items:center;gap:10px;font-size:.9rem;line-height:1.5}
.probe.ok{color:var(--green)}.probe.warn{color:var(--amber)}
.probe img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--ln)}
.fm{padding:16px 18px;display:grid;gap:12px;align-content:start}
.fm label{display:grid;gap:5px;font-weight:600;font-size:.86rem}
.fm .r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fm textarea{min-height:76px;resize:vertical}
.sub{color:var(--mu);font-size:.84rem;font-weight:400}
.da{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--ln);background:var(--surface)}
.rej{grid-column:1/-1;display:none;padding:14px 18px;border-top:1px solid var(--ln);background:var(--redSoft)}
.rej.on{display:grid;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:36px;padding:4px 14px;border:1px solid var(--ln);border-radius:99px;background:var(--surface);font-size:.85rem;cursor:pointer}
.chips button:hover{border-color:var(--red)}

.toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;display:grid;gap:8px;width:max-content;max-width:92vw}
.toast{padding:11px 18px;border-radius:12px;background:var(--navy);color:#fff;font-weight:600;box-shadow:var(--shadow)}
.toast.err{background:var(--red)}

@media(max-width:760px){
  .db{grid-template-columns:1fr}
  .pv{border-right:0;border-bottom:1px solid var(--ln)}
  .pv iframe{height:300px}
  .item{grid-template-columns:1fr}
  .fm .r2{grid-template-columns:1fr}
  .da .btn{flex:1 1 140px}
}
@media(prefers-reduced-motion:reduce){.sk{animation:none}.btn{transition:none}}

/* ---------- ধাপ ১০: ট্যাব, সারাংশ, বাল্ক, রিপোর্ট, তালিকা ---------- */
.tabs{display:flex;gap:4px;margin:0 0 14px;overflow-x:auto;border-bottom:1px solid var(--ln);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:8px 18px;border:0;border-bottom:3px solid transparent;background:none;color:var(--mu);font-weight:700;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--gold)}
.tab em{min-width:22px;padding:1px 7px;border-radius:99px;background:var(--red);color:#fff;font-size:.76rem;font-style:normal;font-weight:800;text-align:center}
.tab em:empty{display:none}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin:0 0 16px}
.stat{padding:12px 14px;border:1px solid var(--ln);border-radius:16px;background:var(--surface);text-align:left;font:inherit;color:inherit}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--gold)}
.stat b{display:block;font-size:1.55rem;line-height:1.25}
.stat span{color:var(--mu);font-size:.82rem;font-weight:600}
.stat.warn b{color:var(--amber)}.stat.ok b{color:var(--green)}.stat.dng b{color:var(--red)}

.selbar{position:sticky;top:8px;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 0 12px;padding:10px 14px;border:1px solid var(--ln);border-radius:14px;background:var(--surface2);box-shadow:var(--shadow)}
.selbar[hidden]{display:none}
.selbar .grow{flex:1 1 120px;color:var(--mu);font-size:.9rem}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
.item.has-sel{grid-template-columns:auto 1fr auto}
.acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.note{margin-top:6px;padding:6px 10px;border-left:3px solid var(--gold);border-radius:6px;background:var(--surface2);font-size:.86rem;overflow-wrap:anywhere}

.mh{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;margin:6px 0 12px}
.mh h3{flex:1 1 200px;font-size:1.1rem}
.mh h3 small{color:var(--mu);font-weight:400;font-size:.85rem}
.mh .in{width:auto;min-width:180px}
.sub-h{margin:22px 0 10px;color:var(--mu);font-size:.95rem}
.code{display:inline-block;min-width:60px;margin-right:6px;padding:1px 9px;border-radius:8px;background:var(--navy);color:var(--gold2);font-size:.82rem;font-weight:700;text-align:center}
.dlg.sm{max-width:520px}
.checks{display:grid;gap:4px;max-height:220px;overflow-y:auto;padding:8px;border:1px solid var(--ln);border-radius:12px}
.fm .checks label{display:flex;flex-direction:row;align-items:center;gap:8px;min-height:34px;font-weight:500;font-size:.92rem}
.fm .checks input,.fm label.one input{width:18px;height:18px;accent-color:var(--gold)}
.fm label.one{display:flex;flex-direction:row;align-items:center;gap:8px}
.fm .in[readonly]{background:var(--surface2);color:var(--mu)}
@media(max-width:760px){
  .acts{justify-content:flex-start}
  .item.has-sel{grid-template-columns:auto 1fr}
  .item.has-sel>.btn,.item.has-sel>.acts{grid-column:1/-1}
  .stat b{font-size:1.3rem}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== লগইন (অন্য অ্যাডমিন পেজের মতোই: আইডি/পাসওয়ার্ড বা Google) ===== -->
  <div id="gate">
    <div class="card">
      <div class="g-hero"><h1>লাইব্রেরি অ্যাডমিন</h1><p>শুধু অ্যাডমিনের জন্য</p></div>
      <div class="g-body">
        <form id="lf" novalidate style="display:grid;gap:14px">
          <label>অ্যাডমিন আইডি
            <input class="in" id="lid" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="আইডি বা ইমেইল">
          </label>
          <label>পাসওয়ার্ড
            <input class="in" id="lpw" type="password" autocomplete="current-password" placeholder="••••••••">
          </label>
          <button class="btn pri wide" id="login" type="submit">লগ ইন</button>
        </form>
        <div class="or">অথবা</div>
        <button class="btn wide" id="glogin" type="button">Google দিয়ে সাইন ইন</button>
        <p class="msg" id="gmsg" role="alert"></p>
      </div>
    </div>
  </div>

  <!-- ===== অ্যাপ ===== -->
  <div id="app" style="display:none">
    <div class="bar">
      <h2>লাইব্রেরি অ্যাডমিন<small>জমা পর্যালোচনা, রিপোর্ট ও তালিকা ব্যবস্থাপনা</small></h2>
      <span class="who" id="who"></span>
      <button class="btn sm" id="ref" type="button">রিফ্রেশ</button>
      <button class="btn sm dng" id="out" type="button">সাইন আউট</button>
    </div>
    <div class="stats" id="stats" aria-label="সারাংশ"></div>
    <div class="tabs" role="tablist" aria-label="বিভাগ">
      <button type="button" class="tab on" role="tab" id="t-review" aria-controls="p-review" aria-selected="true" data-tab="review">জমা</button>
      <button type="button" class="tab" role="tab" id="t-reports" aria-controls="p-reports" aria-selected="false" tabindex="-1" data-tab="reports">রিপোর্ট <em id="t-reports-n"></em></button>
      <button type="button" class="tab" role="tab" id="t-meta" aria-controls="p-meta" aria-selected="false" tabindex="-1" data-tab="meta">তালিকা</button>
    </div>

    <!-- ===== জমা পর্যালোচনা ===== -->
    <div id="p-review" role="tabpanel" aria-labelledby="t-review">
      <div class="filters" id="filters" role="group" aria-label="অবস্থা অনুযায়ী ফিল্টার"></div>
      <input class="in search" id="q" type="search" autocomplete="off" placeholder="শিরোনাম, কোর্স কোড বা কোর্সের নাম খুঁজুন">
      <div class="selbar" id="selbar" hidden>
        <label class="chk"><input type="checkbox" id="sel-all"> সব বেছে নিন</label>
        <span class="grow" id="sel-n"></span>
        <button type="button" class="btn ok sm" id="bulk" disabled>বেছে নেওয়াগুলো অনুমোদন দিন</button>
      </div>
      <div class="list" id="list" aria-live="polite"></div>
    </div>

    <!-- ===== রিপোর্ট ===== -->
    <div id="p-reports" role="tabpanel" aria-labelledby="t-reports" hidden>
      <div class="filters" id="rfilters" role="group" aria-label="রিপোর্টের অবস্থা"></div>
      <div class="list" id="rlist" aria-live="polite"></div>
    </div>

    <!-- ===== তালিকা (কলেজ / বিভাগ / কোর্স) ===== -->
    <div id="p-meta" role="tabpanel" aria-labelledby="t-meta" hidden>
      <div class="filters" id="mfilters" role="group" aria-label="তালিকার ধরন"></div>
      <div id="mbody"></div>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

  t.textContent = msg;
  $("toasts").appendChild(t);
  setTimeout(() => t.remove(), type === "err" ? 5000 : 2600);
}
const errToast = e => toast("কাজটি সম্পন্ন হয়নি: " + (e.code || e.message), "err");
const ms = t => (t && t.toMillis ? t.toMillis() : 0);
function fd(t) {
  const m = ms(t);
  return m ? new Date(m).toLocaleString("bn-BD", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" }) : "—";
}

/* ---------- ডেটা ---------- */
/* একসঙ্গে ফাইল, রিপোর্ট ও তালিকা (lib_meta) আনে। রিপোর্ট বা তালিকা না এলেও ফাইলের কাজ চলে। */
async function load() {
  $("list").innerHTML = '<div class="sk"></div>'.repeat(3);
  try {
    const [rs, rp, mt] = await Promise.all([
      getDocs(collection(db, "lib_resources")),
      getDocs(collection(db, "lib_reports")).catch(e => { REP_ERR = e.code || e.message; return null; }),
      getDocs(collection(db, "lib_meta")).catch(e => { META_ERR = e.code || e.message; return null; })
    ]);
    ALL = rs.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => ms(b.createdAt) - ms(a.createdAt));
    if (rp) { REP_ERR = ""; REPORTS = rp.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => ms(b.createdAt) - ms(a.createdAt)); }
    if (mt) { META_ERR = ""; META = mt.docs.map(x => ({ id: x.id, data: x.data() })); }
    rebuild();
    renderTab();
  } catch (e) {
    $("list").innerHTML = '<div class="card empty">ডেটা লোড হয়নি: ' + esc(e.code || e.message) + '<br><small>Firestore Rules ও অ্যাডমিন অ্যাকাউন্ট দেখুন।</small></div>';
  }
}
$("ref").onclick = load;

/* ডিফল্ট তালিকা + lib_meta মিশিয়ে কার্যকর তালিকা বানায় (পাবলিক পেজের মতোই) */
function rebuild() { D.reset(); D.merge(META.map(m => m.data)); }

/* পাবলিক লাইব্রেরির ৩ মিনিটের ক্যাশ বাতিলের চিহ্ন (একই ব্রাউজারের সব ট্যাবে কাজ করে) */
function bust() { try { localStorage.setItem("dcu-lib-bust", String(Date.now())); } catch (e) { /* ঠিক আছে */ } }

/* ব্যাচে লেখা (প্রতি ব্যাচে ৪০০টির বেশি নয়; Firestore-এর সীমা ৫০০) */
async function commit(ops) {
  try {
    for (let i = 0; i < ops.length; i += 400) {
      const b = writeBatch(db);
      ops.slice(i, i + 400).forEach(f => f(b));
      await b.commit();
    }
  } finally { bust(); }
}

const stOf = r => r.status || "pending";
const count = s => s === "all" ? ALL.length : ALL.filter(r => stOf(r) === s).length;

/* ---------- রিপোর্ট: ফাইল ধরে গোছানো ---------- */
function groups() {
  const m = new Map();
  REPORTS.forEach(x => {
    if (!m.has(x.resourceId)) m.set(x.resourceId, { rid: x.resourceId, items: [] });
    m.get(x.resourceId).items.push(x);
  });
  return Array.from(m.values()).map(g => {
    g.open = g.items.filter(x => !x.resolved);
    g.last = Math.max.apply(null, g.items.map(x => ms(x.createdAt)));
    g.res = ALL.find(r => r.id === g.rid) || null;
    return g;
  });
}
const openGroups = () => groups().filter(g => g.open.length);

/* ---------- সারাংশ ---------- */
function renderStats() {

/* ---------- ট্যাব ---------- */
const TABS = ["review", "reports", "meta"];
function setTab(t, silent) {
  if (TABS.indexOf(t) < 0) t = "review";
  tab = t;
  TABS.forEach(k => {
    $("p-" + k).hidden = k !== t;
    const b = $("t-" + k);
    b.setAttribute("aria-selected", String(k === t)); b.classList.toggle("on", k === t); b.tabIndex = k === t ? 0 : -1;
  });
  if (!silent) { try { history.replaceState(null, "", "#" + t); } catch (e) { /* ঠিক আছে */ } }
  renderTab();
}
function renderTab() {
  renderStats();
  if (tab === "reports") renderReports();
  else if (tab === "meta") renderMeta();
  else render();
}
document.querySelector(".tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) setTab(b.dataset.tab); });
document.querySelector(".tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;

  setTab(n); $("t-" + n).focus(); e.preventDefault();
});

/* ---------- জমা পর্যালোচনা (বাল্ক অনুমোদনসহ) ---------- */

function renderSelBar() {

/* ---------- ফাইল লুকানো / মোছা ---------- */
async function hideResource(id, quiet) {
  const r = ALL.find(x => x.id === id); if (!r || busy) return;
  busy = true;
  try {
    const ops = [b => b.update(doc(db, "lib_resources", id), { status: "hidden", reviewedAt: serverTimestamp() })];
    REPORTS.filter(x => x.resourceId === id && !x.resolved).forEach(x => ops.push(b => b.update(doc(db, "lib_reports", x.id), { resolved: true, resolvedAt: serverTimestamp() })));
    await commit(ops);
    r.status = "hidden";
    REPORTS.filter(x => x.resourceId === id).forEach(x => { x.resolved = true; });
    if (!quiet) toast("ফাইলটি লুকানো হয়েছে");
  } catch (err) { errToast(err); }
  busy = false; renderTab();
}
async function deleteResource(id) {
  const r = ALL.find(x => x.id === id); if (busy) return false;
  if (!confirm("“" + (r ? r.title : id) + "” স্থায়ীভাবে মুছবেন?\n\nশুধু লাইব্রেরির তালিকা থেকে মুছবে, Drive-এর মূল ফাইল মুছবে না। এর রিপোর্টগুলোও মুছে যাবে। মোছার পর একই লিংক আবার জমা দেওয়া যাবে। এটি ফেরানো যাবে না। আপাতত শুধু লুকাতে চাইলে “লুকান” বেছে নিন।")) return false;
  busy = true;
  let ok = false;
  try {
    const ops = [b => b.delete(doc(db, "lib_resources", id))];
    REPORTS.filter(x => x.resourceId === id).forEach(x => ops.push(b => b.delete(doc(db, "lib_reports", x.id))));
    await commit(ops);
    ALL = ALL.filter(x => x.id !== id); REPORTS = REPORTS.filter(x => x.resourceId !== id); SEL.delete(id);
    toast("মোছা হয়েছে"); ok = true;
  } catch (err) { errToast(err); }
  busy = false; renderTab();

}
async function resolveReports(id, undo) {
  if (busy) return;

    const list = REPORTS.filter(x => x.resourceId === id && (undo ? x.resolved : !x.resolved));
    await commit(list.map(x => b => b.update(doc(db, "lib_reports", x.id), undo ? { resolved: false, resolvedAt: deleteField() } : { resolved: true, resolvedAt: serverTimestamp() })));
    list.forEach(x => { x.resolved = !undo; });
    toast(undo ? "আবার খোলা হয়েছে" : "সমাধান হিসেবে চিহ্নিত হয়েছে");
  } catch (err) { errToast(err); }
  busy = false; renderTab();
}
async function deleteReports(id) {

    toast("রিপোর্ট মোছা হয়েছে");
  } catch (err) { errToast(err); }

      : '<h3>ফাইলটি আর নেই <span class="pill mu">মোছা</span></h3><div class="meta">ফাইল ID: ' + esc(g.rid) + "</div>";

        '<button type="button" class="btn sm dng" data-rd="' + esc(g.rid) + '">মুছুন</button>' +
        (g.open.length ? '<button type="button" class="btn sm ok" data-rs="' + esc(g.rid) + '">সমস্যা নেই / সমাধান</button>'
                       : '<button type="button" class="btn sm" data-ru="' + esc(g.rid) + '">আবার খুলুন</button>')

/* ---------- ফর্ম-ডায়ালগ (তালিকা সম্পাদনার জন্য) ----------
 * fields: [{ k, label, type:"text"|"select"|"checks"|"check", value, max, ro, hint, options:[[v,l]], text }]
 * save(values) → ত্রুটির বার্তা (string) ফেরালে ডায়ালগ খোলা থাকে; অন্যথায় বন্ধ হয় */
function formDialog(o) {
  closeReview();
  lastFocus = document.activeElement;
  const ov = document.createElement("div");
  ov.className = "ov"; ov.id = "ov";
  const field = f => {
    const id = "mf-" + f.k;
    if (f.type === "select")
      return '<label>' + esc(f.label) + '<select class="in" id="' + id + '">' + opts(f.options, f.value, x => x[0], x => x[1]) + "</select></label>";
    if (f.type === "checks")
      return '<div><b class="sub" style="font-weight:600;color:var(--ink)">' + esc(f.label) + '</b><div class="checks" id="' + id + '">' +
        f.options.map(x => '<label><input type="checkbox" value="' + esc(x[0]) + '"' + ((f.value || []).indexOf(x[0]) > -1 ? " checked" : "") + "><span>" + esc(x[1]) + "</span></label>").join("") + "</div>" +
        (f.hint ? '<span class="sub">' + esc(f.hint) + "</span>" : "") + "</div>";
    if (f.type === "check")
      return '<label class="one"><input type="checkbox" id="' + id + '"' + (f.value ? " checked" : "") + "><span>" + esc(f.text || f.label) + "</span></label>";
    return '<label>' + esc(f.label) + '<input class="in" id="' + id + '" maxlength="' + (f.max || 100) + '" value="' + esc(f.value || "") + '"' + (f.ro ? " readonly" : "") +
      (f.ltr ? ' autocapitalize="none" spellcheck="false"' : "") + ">" + (f.hint ? '<span class="sub">' + esc(f.hint) + "</span>" : "") + "</label>";
  };
  ov.innerHTML = '<div class="card dlg sm" role="dialog" aria-modal="true" aria-labelledby="dt">' +
    '<div class="dh"><h3 id="dt">' + esc(o.title) + '</h3><button class="x" type="button" data-x aria-label="বন্ধ করুন">×</button></div>' +
    '<form class="fm" id="mf" novalidate>' + o.fields.map(field).join("") + '<p class="msg" id="mf-msg" role="alert"></p></form>' +
    '<div class="da"><button type="button" class="btn" data-x>বাতিল</button><button type="button" class="btn pri" id="mf-ok">সংরক্ষণ</button></div></div>';
  document.body.appendChild(ov);
  document.body.style.overflow = "hidden";

  const read = () => {
    const v = {};
    o.fields.forEach(f => {
      const el = $("mf-" + f.k);
      if (f.type === "checks") v[f.k] = Array.from(el.querySelectorAll("input:checked")).map(x => x.value);
      else if (f.type === "check") v[f.k] = el.checked;
      else if (f.type === "select") v[f.k] = el.value;
      else v[f.k] = clean(el.value);
    });
    return v;
  };
  const ok = $("mf-ok");
  const go = async () => {
    if (busy) return;
    busy = true; ok.disabled = true; $("mf-msg").textContent = "";
    let err = null;
    try { err = await o.save(read()); } catch (e) { err = "সংরক্ষণ হয়নি: " + (e.code || e.message); }
    busy = false;
    if (typeof err === "string") { ok.disabled = false; $("mf-msg").textContent = err; return; }
    closeReview();
  };
  ok.onclick = go;
  $("mf").onsubmit = ev => { ev.preventDefault(); go(); };
  const first = ov.querySelector("input:not([readonly]),select");
  (first || ov.querySelector("[data-x]")).focus();
}

};
const mdoc = id => META.find(m => m.id === id) || null;

const isDefDept = s => DEF.departments.some(d => d.slug === s);

async function metaSet(id, data) {
  await setDoc(doc(db, "lib_meta", id), data);
  bust();
  const m = mdoc(id);
  if (m) m.data = data; else META.push({ id, data });
  rebuild(); renderTab();
}
async function metaDel(id) {
  await deleteDoc(doc(db, "lib_meta", id));
  bust();
  META = META.filter(m => m.id !== id);
  rebuild(); renderTab();
}
async function metaRun(fn, okMsg) {
  if (busy) return;
  busy = true;
  try { await fn(); toast(okMsg); } catch (e) { errToast(e); }
  busy = false; renderTab();
}

const nameOk = s => s.length >= 2 && s.length <= 80;

      if (edit) { v.dept = c.dept; v.code = c.code; }
      if (!CODE_RE.test(v.code)) return "কোর্স কোড ২–২০ অক্ষরের হতে হবে (ইংরেজি অক্ষর, সংখ্যা, স্পেস, . _ -)।";
      if (v.en.length < 2 || v.en.length > 100) return "ইংরেজি নাম ২–১০০ অক্ষরের হতে হবে।";
      if (v.bn.length > 100) return "বাংলা নাম ১০০ অক্ষরের বেশি হবে না।";
      const id = metaId.course(edit ? c.dept : v.dept, edit ? c.year : year, v.code);
      if (!edit) {
        if (D.courses(v.dept, year).some(x => x.code === v.code)) return "এই বিভাগ ও বর্ষে এই কোড আগেই আছে।";
        if (mdoc(id)) return "এই কোডের কোর্স লুকানো তালিকায় আছে; সেখান থেকে ফিরিয়ে আনুন।";
      }
      const data = { type: "course", dept: edit ? c.dept : v.dept, year: edit ? c.year : year, code: v.code, en: v.en, active: true };
      if (v.bn) data.bn = v.bn;
      if (v.opt) data.opt = true;
      await metaSet(id, data);
      toast(edit ? "কোর্স সংরক্ষিত হয়েছে" : "কোর্স যোগ হয়েছে");
    }
  });
}

/* ---------- রিভিউ ডায়ালগ ---------- */
function opts(items, val, vf, lf) {
  return items.map(i => '<option value="' + esc(vf(i)) + '"' + (String(vf(i)) === String(val) ? " selected" : "") + ">" + esc(lf(i)) + "</option>").join("");
}
function previewUrl(r) {
  /* জমার সময় Docs লিংক /preview আর Drive লিংক /view হিসেবে রাখা হয়; এখানে সবই /preview */
  if (/^https:\/\/docs\.google\.com\//.test(r.driveUrl || "")) return r.driveUrl;
  return "https://drive.google.com/file/d/" + encodeURIComponent(r.fileId) + "/preview";
}
function probeThumb(id) {
  return new Promise(resolve => {
    const url = "https://drive.google.com/thumbnail?id=" + encodeURIComponent(id) + "&sz=w200";
    const im = new Image(); im.referrerPolicy = "no-referrer";
    const t = setTimeout(() => { im.onload = im.onerror = null; resolve(null); }, 8000);
    im.onload = () => { clearTimeout(t); resolve(im.naturalWidth > 1 ? url : null); };
    im.onerror = () => { clearTimeout(t); resolve(null); };
    im.src = url;
  });
}

/* ফর্ম থেকে মান পড়ে Rules-এর সীমা অনুযায়ী যাচাই; ভুল থাকলে বার্তা ফেরায় */
function readEdits() {
  const g = id => $(id).value;
  const e = {
    title: clean(g("e-title")), college: g("e-college"), dept: g("e-dept"), year: Number(g("e-year")),
    courseCode: clean(g("e-code")), courseName: clean(g("e-cname")), fileType: g("e-ftype"), examType: g("e-etype"),
    examYear: Number(g("e-eyear")) || 0, desc: g("e-desc").trim()
  };
  if (e.title.length < 3 || e.title.length > 120) return "শিরোনাম ৩ থেকে ১২০ অক্ষরের হতে হবে।";
  if (e.courseCode.length < 2 || e.courseCode.length > 20) return "কোর্স কোড ২ থেকে ২০ অক্ষরের হতে হবে।";
  if (e.courseName.length < 2 || e.courseName.length > 100) return "কোর্সের নাম ২ থেকে ১০০ অক্ষরের হতে হবে।";
  if (!(e.examYear === 0 || (e.examYear >= 2000 && e.examYear <= 2100))) return "পরীক্ষার সাল ০ বা ২০০০–২১০০ হতে হবে।";
  if (e.desc.length > 500) return "বিবরণ ৫০০ অক্ষরের বেশি হবে না।";
  return e;
}

async function apply(extra, okMsg) {
  if (busy || !current) return;
  const e = readEdits();
  if (typeof e === "string") { toast(e, "err"); return; }
  busy = true;
  document.querySelectorAll("#ov .btn").forEach(b => b.disabled = true);
  try {
    await updateDoc(doc(db, "lib_resources", current.id), Object.assign({}, e, extra, {
      reviewedAt: serverTimestamp()   // অ্যাডমিনের ইমেইল রাখা হয় না: approved ডকুমেন্ট পাবলিক পড়তে পারে
    }));
    bust();
    Object.assign(current, e, extra);
    if (typeof current.rejectReason !== "string") delete current.rejectReason;   // deleteField() চিহ্ন স্মৃতিতে রাখা হয় না
    current.reviewedAt = { toMillis: () => Date.now() };
    toast(okMsg);
    const rid = current.id, wasHidden = extra.status === "hidden";
    busy = false; closeReview(); renderTab();
    if (wasHidden && REPORTS.some(x => x.resourceId === rid && !x.resolved)) resolveReports(rid);   // লুকালে ওই ফাইলের খোলা রিপোর্ট সমাধান ধরা হয়
  } catch (err) {
    errToast(err);
    busy = false;
    document.querySelectorAll("#ov .btn").forEach(b => b.disabled = false);
  }
}

    /* ব্যক্তিগত লিংক আটকানো: থাম্বনেইল না এলে নিশ্চিত করতে বলে */
    if (probeOk === false && !confirm("থাম্বনেইল লোড হয়নি, তাই লিংকটি ব্যক্তিগত হতে পারে। প্রিভিউ ও ইনকগনিটো উইন্ডোতে দেখে নিয়েছেন? তবুও অনুমোদন দেবেন?")) return;
    apply({ status: "approved", rejectReason: deleteField() }, "অনুমোদিত হয়েছে");
  }
  else if (e.target.closest("[data-save]")) apply({}, "সংরক্ষিত হয়েছে");
  else if (e.target.closest("[data-hide]")) apply({ status: "hidden" }, "ফাইলটি লুকানো হয়েছে");
  else if (e.target.closest("[data-unhide]")) apply({ status: "approved", rejectReason: deleteField() }, "আবার প্রকাশ করা হয়েছে");
  else if (e.target.closest("[data-del]")) { if (current && await deleteResource(current.id)) closeReview(); }
  else if (e.target.closest("[data-pend]")) apply({ status: "pending", rejectReason: deleteField() }, "অপেক্ষমাণে ফেরানো হয়েছে");
  else if (e.target.closest("[data-reject]")) { $("rej").classList.add("on"); $("rej-t").focus(); $("rej").scrollIntoView({ block: "nearest" }); }
  else if (e.target.closest("[data-rejno]")) $("rej").classList.remove("on");
  else if (e.target.closest("[data-rr]")) $("rej-t").value = REJECT_REASONS[Number(e.target.closest("[data-rr]").dataset.rr)];
  else if (e.target.closest("[data-rejgo]")) {
    const reason = clean($("rej-t").value);
    if (!reason) { toast("বাতিলের একটি কারণ লিখুন।", "err"); $("rej-t").focus(); return; }
    apply({ status: "rejected", rejectReason: reason.slice(0, 200) }, "বাতিল করা হয়েছে");
  }
});

/* ডায়ালগের ভেতরে Tab আটকে রাখা */
document.addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  const o = $("ov"); if (!o) return;
  const f = Array.from(o.querySelectorAll("button,input,select,textarea,a[href],iframe")).filter(x => !x.disabled && x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (!o.contains(document.activeElement)) { first.focus(); e.preventDefault(); }
  else if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
  else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
});
</script>
